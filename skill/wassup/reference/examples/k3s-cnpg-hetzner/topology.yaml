# bookstore on k3s, CloudNativePG and Hetzner: the reference example.
version: 1
name: bookstore
settings:
  auto_lens: true
  lookback: 3h
groups:
  - id: hetzner
    kind: cloud
    label: Hetzner
  - id: k3s
    kind: cluster
    label: k3s
    parent: hetzner
  - id: bookstore
    kind: namespace
    label: bookstore
    parent: k3s
components:
  - id: dns
    type: dns
    label: bookstore.example
    group: hetzner
  - id: fw
    type: firewall
    label: Firewall
    group: hetzner
  - id: lb
    type: lb
    label: Load balancer
    group: hetzner
  - id: ingress
    type: ingress
    label: Ingress
    group: k3s
    runs_on:
      - node-1
      - node-2
      - node-3
  - id: node-1
    type: node
    group: k3s
  - id: node-2
    type: node
    group: k3s
  - id: node-3
    type: node
    group: k3s
  - id: api
    type: workload
    label: API
    group: bookstore
    runs_on:
      - node-1
      - node-2
      - node-3
    owner: "@danilo"
  - id: worker
    type: workload
    label: Workers
    group: bookstore
    runs_on:
      - node-1
      - node-2
  - id: default-queue
    type: queue
    label: Default queue
    group: bookstore
  - id: exports-queue
    type: queue
    label: Exports queue
    group: bookstore
  - id: docs-sync
    type: job
    label: Docs sync
    group: bookstore
  - id: cache
    type: cache
    label: Redis
    group: bookstore
  - id: db
    type: db
    label: Database
    group: bookstore
    engine: postgres
    roles:
      primary: db-primary
      replicas:
        - db-r1
        - db-r2
  - id: signoz
    type: observability
    label: SigNoz
    group: k3s
  - id: github
    type: external
    label: GitHub
edges:
  - from: dns
    to: lb
    kind: tcp
  - from: lb
    to: ingress
    kind: http
    label: requests
  - from: lb
    to: node-1
    kind: tcp
  - from: lb
    to: node-2
    kind: tcp
  - from: lb
    to: node-3
    kind: tcp
  - from: ingress
    to: api
    kind: http
  - from: api
    to: db
    kind: sql
  - from: api
    to: cache
    kind: cache
  - from: api
    to: default-queue
    kind: queue
  - from: api
    to: exports-queue
    kind: queue
  - from: default-queue
    to: worker
    kind: queue
  - from: exports-queue
    to: worker
    kind: queue
  - from: worker
    to: db
    kind: sql
  - from: worker
    to: github
    kind: external
  - from: docs-sync
    to: worker
    kind: queue
  - from: db-primary
    to: db-r1
    kind: replication
  - from: db-primary
    to: db-r2
    kind: replication
  - from: fw
    to: signoz
    kind: tcp
    label: OTLP
