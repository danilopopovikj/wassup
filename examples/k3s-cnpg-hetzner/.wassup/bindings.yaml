# Probes attach each component and edge to live data. Secrets come from env vars named here, never from this file.
version: 1
components:
  dns:
    - probe: dns.record
      host: bookstore.example
  fw:
    - probe: hcloud.firewall
      name: bookstore
  lb:
    - probe: hcloud.lb
      name: bookstore-lb
      targets:
        node-1: node-1
        node-2: node-2
        node-3: node-3
  ingress:
    - probe: k8s.ingress
      namespace: bookstore
      name: bookstore
  node-1:
    - probe: k8s.node
      name: node-1
  node-2:
    - probe: k8s.node
      name: node-2
  node-3:
    - probe: k8s.node
      name: node-3
  api:
    - probe: k8s.workload
      namespace: bookstore
      selector: app=api
  default-queue:
    - probe: celery.queue
      broker: "redis://redis.bookstore:6379/0"
      queue: default
  exports-queue:
    - probe: celery.queue
      broker: "redis://redis.bookstore:6379/0"
      queue: exports
  docs-sync:
    - probe: k8s.cronjob
      namespace: bookstore
      name: docs-sync
  cache:
    - probe: redis.info
      addr: "redis.bookstore:6379"
  media:
    - probe: s3.bucket
      bucket: bookstore-media
      endpoint: "https://fsn1.your-objectstorage.com"
      region: fsn1
      access_key_env: HETZNER_S3_ACCESS_KEY
      secret_key_env: HETZNER_S3_SECRET_KEY
      # Sizing the bucket lists every object, one request per thousand.
      list_objects: true
      quota_bytes: 1000000000000
  db:
    - probe: cnpg.cluster
      namespace: bookstore
      cluster: bookstore-db
  db-primary:
    - probe: cnpg.instance
      namespace: bookstore
      cluster: bookstore-db
      role: primary
    # via makes wassup open its own port-forward to the Service, so the DSN
    # only says who connects to which database. Any role that can connect
    # works; without pg_read_all_stats the lag is read from the slots.
    - probe: pg.stats
      via: k8s.service/bookstore/bookstore-db-rw:5432
      dsn_env: BOOKSTORE_PG_DSN
  db-r1:
    - probe: cnpg.instance
      namespace: bookstore
      cluster: bookstore-db
      instance: bookstore-db-2
  db-r2:
    - probe: cnpg.instance
      namespace: bookstore
      cluster: bookstore-db
      instance: bookstore-db-3
  signoz:
    - probe: signoz.health
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
  github:
    - probe: http.ping
      url: "https://api.github.com"
  worker:
    - probe: k8s.workload
      namespace: bookstore
      selector: app=worker
edges:
  lb->ingress:
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      from: lb
      to: ingress
  ingress->api:
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      from: ingress
      to: api
  api->db:
    - probe: pg.pool
      dsn_env: BOOKSTORE_PGBOUNCER_DSN
      via: k8s.service/bookstore/bookstore-db-pooler-rw:5432
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      from: api
      to: postgres
  api->cache:
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      from: api
      to: redis
  db-primary->db-r1:
    - probe: pg.stats
      dsn_env: BOOKSTORE_PG_DSN
      via: k8s.service/bookstore/bookstore-db-rw:5432
      # the instance name; its slot is _cnpg_bookstore_db_2
      replica: bookstore-db-2
  db-primary->db-r2:
    - probe: pg.stats
      dsn_env: BOOKSTORE_PG_DSN
      via: k8s.service/bookstore/bookstore-db-rw:5432
      replica: bookstore-db-3
  fw->signoz:
    - probe: hcloud.firewall
      name: bookstore
      port: 4317
  worker->github:
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      from: worker
      to: api.github.com
