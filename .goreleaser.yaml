version: 2
project_name: wassup
builds:
  - main: ./cmd/wassup
    binary: wassup
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.Version={{.Version}}"]
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
brews:
  - repository:
      owner: danilopopovikj
      name: homebrew-tap
    homepage: https://github.com/danilopopovikj/wassup
    description: One live architecture diagram of a Kubernetes-hosted system
    license: MIT
release:
  draft: true
