name: Release

# Pushing a tag like v0.1.0 builds the binaries and opens a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the archives
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release notes are built from the full history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-checksums: dist/checksums.txt
      # The provenance sits next to the archives too, so a release can be
      # verified from its own files, without asking GitHub for the attestation.
      - name: Attach the provenance to the release
        run: |
          cp "$BUNDLE" "$PROVENANCE"
          gh release upload "$GITHUB_REF_NAME" "$PROVENANCE" --repo "$GITHUB_REPOSITORY"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          PROVENANCE: wassup_${{ github.ref_name }}.intoto.jsonl
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
