name: wassup

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make lint
      - run: make test
      - run: make build
      - run: ./wassup replay --check testdata/scenarios/02-connection-pool-exhausted
