apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bookstore
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/bookstore/api:1.2.3
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: database-url
            - name: PGHOST
              value: bookstore-db-rw.bookstore
            - name: REDIS_URL
              value: redis://redis.bookstore:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis.bookstore:6379/1
            - name: HATCHET_CLIENT_HOST_PORT
              value: hatchet-engine.bookstore:7070
            - name: HATCHET_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hatchet
                  key: token
            - name: ELECTRIC_URL
              value: http://electric.bookstore:3000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bookstore
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstore
  namespace: bookstore
spec:
  rules:
    - host: app.bookstore.example
      http:
        paths:
          - path: /
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /shapes
            backend:
              service:
                name: electric
                port:
                  number: 3000
