apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  POSTGRES_SERVER: bookstore-db-rw
  POSTGRES_USER: app
  POSTGRES_DB: bookstore
  CACHE_HOST: cache
  HATCHET_CLIENT_HOST_PORT: hatchet-engine:7070
  ELECTRIC_URL: http://electric:3000
  OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-otel-collector.platform:4317
  CLICKHOUSE_DSN: tcp://clickhouse.platform:9000/?database=traces&username=admin&password=Ch-Dsn-Pa55-9d41
  PUBLIC_URL: https://app.${DOMAIN}
  S3_BUCKET: bookstore-attachments
  S3_ENDPOINT: https://fsn1.your-objectstorage.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bookstore-backend
  template:
    metadata:
      labels:
        app: bookstore-backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: node-2
      containers:
        - name: backend
          image: ghcr.io/bookstore/backend:4.1.0
          args: ["uvicorn", "app.main:app", "--db-url", "postgresql://app:Pg-Pa55-7f3a@bookstore-db-rw:5432/bookstore", "--admin-password", "Adm1n Pa55 44e0"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: POSTGRES_PASSWORD
              value: Pg-Pa55-7f3a
            - name: CLICKHOUSE_PASSWORD
              value: Ch-Pa55-c0ffee
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_SERVER):5432/$(POSTGRES_DB)
            - name: HATCHET_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hatchet
                  key: token
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: bookstore-backend
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  selector:
    matchLabels:
      app: bookstore-worker
  template:
    metadata:
      labels:
        app: bookstore-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/bookstore/backend:4.1.0
          command: ["celery", "-A", "app", "worker", "-Q", "default"]
          envFrom:
            - configMapRef:
                name: worker-config
          env:
            - name: POSTGRES_SERVER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_SERVER
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  rules:
    - host: app.bookstore.example
      http:
        paths:
          - path: /api/v1/login
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /api/v1/items
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /shapes
            backend:
              service:
                name: electric
                port:
                  number: 3000
    - host: admin.${DOMAIN}
      http:
        paths:
          - path: /
            backend:
              service:
                name: backend
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adminer
  namespace: tools
spec:
  rules:
    - host: adminer.bookstore.example
      http:
        paths:
          - path: /
            backend:
              service:
                name: adminer
                port:
                  number: 8080
