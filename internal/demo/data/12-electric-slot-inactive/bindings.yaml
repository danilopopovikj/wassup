# generated by testdata/scenarios/gen.py
version: 1
components:
  dns:
    - probe: dns.record
      host: bookstore.example
  fw:
    - probe: hcloud.firewall
      name: bookstore
  lb:
    - probe: hcloud.lb
      name: bookstore-lb
      targets:
        node-1: node-1
        node-2: node-2
        node-3: node-3
  ingress:
    - probe: k8s.ingress
      namespace: bookstore
      name: bookstore
  node-1:
    - probe: k8s.node
      name: node-1
  node-2:
    - probe: k8s.node
      name: node-2
  node-3:
    - probe: k8s.node
      name: node-3
  api:
    - probe: k8s.workload
      namespace: bookstore
      selector: app=api
  default-queue:
    - probe: celery.queue
      broker: "redis://redis.bookstore:6379/0"
      queue: default
  exports-queue:
    - probe: celery.queue
      broker: "redis://redis.bookstore:6379/0"
      queue: exports
  docs-sync:
    - probe: k8s.cronjob
      namespace: bookstore
      name: docs-sync
  cache:
    - probe: redis.info
      addr: "redis.bookstore:6379"
  db:
    - probe: cnpg.cluster
      namespace: bookstore
      cluster: bookstore-db
  db-primary:
    - probe: cnpg.instance
      namespace: bookstore
      cluster: bookstore-db
      role: primary
    - probe: pg.stats
      via: k8s.workload/api
      dsn_env: BOOKSTORE_PG_DSN
  db-r1:
    - probe: cnpg.instance
      namespace: bookstore
      cluster: bookstore-db
      instance: bookstore-db-2
  db-r2:
    - probe: cnpg.instance
      namespace: bookstore
      cluster: bookstore-db
      instance: bookstore-db-3
  signoz:
    - probe: signoz.health
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
  github:
    - probe: http.ping
      url: "https://api.github.com"
  worker:
    - probe: k8s.workload
      namespace: bookstore
      selector: app=worker
  hatchet:
    - probe: k8s.workload
      namespace: bookstore
      selector: app=hatchet-engine
    - probe: hatchet.health
      url: "http://hatchet-api.bookstore:8080"
      token_env: HATCHET_CLIENT_TOKEN
      tenant: 707d0855-80ab-4e1f-a156-f1c4546cbf52
  hatchet-queue:
    - probe: hatchet.queue
      url: "http://hatchet-api.bookstore:8080"
      token_env: HATCHET_CLIENT_TOKEN
      tenant: 707d0855-80ab-4e1f-a156-f1c4546cbf52
  hatchet-workers:
    - probe: k8s.workload
      namespace: bookstore
      selector: app=hatchet-worker
    - probe: hatchet.workers
      long_task: 10m
      url: "http://hatchet-api.bookstore:8080"
      token_env: HATCHET_CLIENT_TOKEN
      tenant: 707d0855-80ab-4e1f-a156-f1c4546cbf52
  billing:
    - probe: hatchet.workflow
      workflow: billing
      url: "http://hatchet-api.bookstore:8080"
      token_env: HATCHET_CLIENT_TOKEN
      tenant: 707d0855-80ab-4e1f-a156-f1c4546cbf52
  node-4:
    - probe: k8s.node
      name: node-4
  hatchet-db:
    - probe: pg.stats
      dsn_env: HATCHET_PG_DSN
  electric:
    - probe: k8s.workload
      namespace: bookstore
      selector: app=electric
    - probe: electric.sync
      url: "http://electric.bookstore:3000"
      secret_env: ELECTRIC_SECRET
      table: public.issues
    - probe: pg.stats
      dsn_env: BOOKSTORE_PG_DSN
      replica: electric_slot_default
edges:
  lb->ingress:
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      metric: signoz_calls_total
      match:
        service.name: ingress
        span.kind: SPAN_KIND_SERVER
      errors:
        status.code: STATUS_CODE_ERROR
  ingress->api:
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      metric: signoz_calls_total
      match:
        service.name: api
        span.kind: SPAN_KIND_SERVER
      errors:
        status.code: STATUS_CODE_ERROR
  api->db:
    - probe: pg.pool
      dsn_env: BOOKSTORE_PGBOUNCER_DSN
      via: k8s.workload/api
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      metric: signoz_db_latency_count
      match:
        service.name: api
        db.system: postgresql
      errors:
        status.code: STATUS_CODE_ERROR
  api->cache:
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      metric: signoz_db_latency_count
      match:
        service.name: api
        db.system: redis
      errors:
        status.code: STATUS_CODE_ERROR
  db-primary->db-r1:
    - probe: pg.stats
      dsn_env: BOOKSTORE_PG_DSN
      via: k8s.workload/api
      replica: bookstore-db-2
  db-primary->db-r2:
    - probe: pg.stats
      dsn_env: BOOKSTORE_PG_DSN
      via: k8s.workload/api
      replica: bookstore-db-3
  fw->signoz:
    - probe: hcloud.firewall
      name: bookstore
      port: 4317
  worker->github:
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      metric: signoz_external_call_latency_count
      match:
        service.name: worker
        address: "api\\.github\\.com.*"
      errors:
        status.code: STATUS_CODE_ERROR
  db-primary->electric:
    - probe: pg.stats
      dsn_env: BOOKSTORE_PG_DSN
      via: k8s.workload/api
      replica: electric_slot_default
  ingress->electric:
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      metric: signoz_calls_total
      match:
        service.name: electric
        span.kind: SPAN_KIND_SERVER
      errors:
        status.code: STATUS_CODE_ERROR
  api->hatchet-queue:
    - probe: signoz.edge
      url: "http://signoz.signoz:8080"
      token_env: SIGNOZ_TOKEN
      metric: signoz_external_call_latency_count
      match:
        service.name: api
        address: "hatchet-api\\.bookstore.*"
      errors:
        status.code: STATUS_CODE_ERROR
